# Server Configuration
server.port=8080

# Database Configuration (Spring JDBC + MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/handloom_marketplace?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=e:/handloom-marketplace/uploads/

# Logging
logging.level.com.handloom.marketplace=DEBUG
logging.level.org.springframework.jdbc=INFO
