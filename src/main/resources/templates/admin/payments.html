<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Payment Transactions')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-decoration-none">Admin</a></li>
            <li class="breadcrumb-item active" aria-current="page">Payments</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1"><i class="bi bi-cash-stack me-2 text-primary"></i> Payment Transactions</h3>
            <span class="text-muted small">Financial records for Cash on Delivery and simulated demo online payments</span>
        </div>
        <span class="badge bg-secondary fs-6" th:text="${payments.size()} + ' Transactions'">2 Transactions</span>
    </div>

    <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-custom align-middle mb-0">
                <thead>
                    <tr>
                        <th>Payment ID</th>
                        <th>Order #</th>
                        <th>Amount</th>
                        <th>Payment Method</th>
                        <th>Transaction Date</th>
                        <th>Payment Status</th>
                        <th>Update Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pay : ${payments}">
                        <td class="text-muted small" th:text="'PAY-' + ${pay.id}">PAY-1</td>
                        <td>
                            <strong class="text-dark" th:text="${pay.orderNumber}">ORD-2026-0001</strong>
                        </td>
                        <td class="fw-bold text-dark" th:text="'₹' + ${#numbers.formatDecimal(pay.amount, 1, 'COMMA', 2, 'POINT')}">₹2,250.00</td>
                        <td>
                            <span class="badge bg-light text-dark border" th:text="${pay.paymentMethod}">COD</span>
                        </td>
                        <td class="small text-muted" th:text="${#temporals.format(pay.paymentDate, 'dd MMM yyyy, hh:mm a')}">25 Sep 2026</td>
                        <td>
                            <span th:class="${pay.paymentStatus == 'PAID' ? 'badge bg-success-subtle text-success fs-6' : (pay.paymentStatus == 'PENDING' ? 'badge bg-warning-subtle text-warning fs-6' : 'badge bg-danger-subtle text-danger fs-6')}"
                                  th:text="${pay.paymentStatus}">PENDING</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/payments/{id}/status(id=${pay.id})}" method="post" class="d-flex align-items-center gap-1">
                                <select name="status" class="form-select form-select-sm" style="width: 120px;">
                                    <option value="PENDING" th:selected="${pay.paymentStatus == 'PENDING'}">PENDING</option>
                                    <option value="PAID" th:selected="${pay.paymentStatus == 'PAID'}">PAID</option>
                                    <option value="FAILED" th:selected="${pay.paymentStatus == 'FAILED'}">FAILED</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-outline-primary">Save</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
