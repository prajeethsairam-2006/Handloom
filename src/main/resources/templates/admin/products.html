<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('All Marketplace Products')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-decoration-none">Admin</a></li>
            <li class="breadcrumb-item active" aria-current="page">All Products</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1"><i class="bi bi-box me-2 text-primary"></i> Marketplace Products Catalog</h3>
            <span class="text-muted small">Catalog oversight across all registered artisan looms</span>
        </div>
        <span class="badge bg-secondary fs-6" th:text="${products.size()} + ' Products'">12 Products</span>
    </div>

    <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-custom align-middle mb-0">
                <thead>
                    <tr>
                        <th>Product Details</th>
                        <th>Category</th>
                        <th>Artisan / Loom</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${products}">
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <img th:src="@{${p.imageUrl}}" th:alt="${p.name}" class="rounded border" style="width: 44px; height: 44px; object-fit: cover;">
                                <div>
                                    <a th:href="@{/products/{id}(id=${p.id})}" target="_blank" class="fw-semibold text-dark text-decoration-none small d-block text-truncate" style="max-width: 220px;" th:text="${p.name}">Product Name</a>
                                    <span class="small text-muted" th:text="${p.material}">Material</span>
                                </div>
                            </div>
                        </td>
                        <td class="small" th:text="${p.categoryName}">Category</td>
                        <td>
                            <span class="small fw-semibold text-primary" th:text="${p.artisanBusinessName}">Artisan</span>
                        </td>
                        <td class="fw-semibold text-dark" th:text="'₹' + ${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}">₹2,250.00</td>
                        <td>
                            <span th:class="${p.stockQuantity > 5 ? 'badge bg-success-subtle text-success fs-6' : (p.stockQuantity > 0 ? 'badge bg-warning-subtle text-warning fs-6' : 'badge bg-danger-subtle text-danger fs-6')}"
                                  th:text="${p.stockQuantity}">12</span>
                        </td>
                        <td>
                            <span th:class="${p.status == 'ACTIVE' ? 'badge bg-success' : 'badge bg-secondary'}" th:text="${p.status}">ACTIVE</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/products/{id}/status(id=${p.id})}" method="post" class="d-inline">
                                <input type="hidden" name="status" th:value="${p.status == 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'}">
                                <button type="submit" class="btn btn-sm btn-outline-secondary" th:text="${p.status == 'ACTIVE' ? 'Disable' : 'Enable'}">
                                    Disable
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
