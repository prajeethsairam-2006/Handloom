<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Manage Categories')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-decoration-none">Admin</a></li>
            <li class="breadcrumb-item active" aria-current="page">Product Categories</li>
        </ol>
    </nav>

    <div class="row g-4">
        <!-- Add Category Form -->
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm p-4 rounded-3">
                <h5 class="fw-bold mb-3 border-bottom pb-2">
                    <i class="bi bi-folder-plus text-primary me-1"></i> Add / Edit Category
                </h5>

                <form th:action="@{/admin/categories/save}" th:object="${newCategory}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label for="name" class="form-label small fw-semibold">Category Name *</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="e.g. Traditional Art" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label small fw-semibold">Description</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="2" placeholder="Brief description of the craft category..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="imageUrl" class="form-label small fw-semibold">Category Image Path</label>
                        <input type="text" class="form-control form-control-sm" id="imageUrl" th:field="*{imageUrl}" placeholder="/images/categories/sarees.jpg">
                    </div>

                    <button type="submit" class="btn btn-primary btn-sm w-100 fw-semibold">
                        Save Category
                    </button>
                </form>
            </div>
        </div>

        <!-- Categories Table -->
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0">Platform Craft Categories</h5>
                    <span class="badge bg-secondary" th:text="${categories.size()} + ' Categories'">8 Categories</span>
                </div>

                <div class="table-responsive">
                    <table class="table table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Category Name</th>
                                <th>Description</th>
                                <th>Image Reference</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categories}">
                                <td>
                                    <strong class="text-dark" th:text="${cat.name}">Handloom Sarees</strong>
                                </td>
                                <td class="small text-muted" th:text="${cat.description}">Traditional Sarees</td>
                                <td class="small text-muted font-monospace" th:text="${cat.imageUrl}">/images/categories/sarees.jpg</td>
                                <td class="text-end">
                                    <form th:action="@{/admin/categories/delete/{id}(id=${cat.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-outline-danger btn-sm border-0" onclick="return confirm('Delete this category? Ensure no products are linked.');">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
