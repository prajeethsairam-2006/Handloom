<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Manage Customers')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-decoration-none">Admin</a></li>
            <li class="breadcrumb-item active" aria-current="page">Registered Customers</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1"><i class="bi bi-people me-2 text-primary"></i> Registered Customers</h3>
            <span class="text-muted small">Buyers registered on the marketplace platform</span>
        </div>
        <span class="badge bg-secondary fs-6" th:text="${customers.size()} + ' Customers'">2 Customers</span>
    </div>

    <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-custom align-middle mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Customer Name</th>
                        <th>Email Address</th>
                        <th>Phone</th>
                        <th>Role</th>
                        <th>Joined Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${customers}">
                        <td class="text-muted small" th:text="'#' + ${c.id}">#1</td>
                        <td>
                            <strong class="text-dark" th:text="${c.name}">Priya Sharma</strong>
                        </td>
                        <td class="small" th:text="${c.email}">priya@customer.com</td>
                        <td class="small" th:text="${c.phone}">9876543210</td>
                        <td>
                            <span class="badge bg-secondary" th:text="${c.role}">CUSTOMER</span>
                        </td>
                        <td class="small text-muted" th:text="${#temporals.format(c.createdAt, 'dd MMM yyyy, hh:mm a')}">25 Sep 2026</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
