<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${isEdit} ? 'Edit Product' : 'Add New Handloom Product')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/artisan/dashboard}" class="text-decoration-none">Dashboard</a></li>
            <li class="breadcrumb-item"><a th:href="@{/artisan/products}" class="text-decoration-none">My Products</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${isEdit} ? 'Edit Product' : 'Add Product'">Add Product</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm p-4 rounded-3">
                <div class="d-flex align-items-center gap-2 mb-3 border-bottom pb-2">
                    <i class="bi bi-tag-fill text-primary fs-4"></i>
                    <div>
                        <h4 class="fw-bold mb-0" th:text="${isEdit} ? 'Edit Handloom Product' : 'List New Handcrafted Product'">List New Product</h4>
                        <span class="text-muted small">Enter product specifications and inventory details</span>
                    </div>
                </div>

                <form th:action="${isEdit} ? @{/artisan/products/update} : @{/artisan/products/save}"
                      th:object="${product}"
                      method="post"
                      enctype="multipart/form-data">

                    <input type="hidden" th:if="${isEdit}" th:field="*{id}">

                    <div class="mb-3">
                        <label for="name" class="form-label small fw-semibold">Product Name *</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="e.g. Kanchipuram Pure Mulberry Silk Saree" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="categoryId" class="form-label small fw-semibold">Product Category *</label>
                            <select class="form-select" id="categoryId" th:field="*{categoryId}" required>
                                <option value="">-- Choose Category --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="price" class="form-label small fw-semibold">Price in INR (₹) *</label>
                            <input type="number" step="0.01" min="1" class="form-control" id="price" th:field="*{price}" placeholder="2499.00" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="stockQuantity" class="form-label small fw-semibold">Available Stock Quantity *</label>
                            <input type="number" min="0" class="form-control" id="stockQuantity" th:field="*{stockQuantity}" placeholder="10" required>
                        </div>
                        <div class="col-md-6">
                            <label for="status" class="form-label small fw-semibold">Availability Status</label>
                            <select class="form-select" id="status" th:field="*{status}">
                                <option value="ACTIVE">ACTIVE (Visible in Store)</option>
                                <option value="INACTIVE">INACTIVE (Hidden)</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="material" class="form-label small fw-semibold">Material / Weave *</label>
                            <input type="text" class="form-control" id="material" th:field="*{material}" placeholder="e.g. 100% Organic Handloom Cotton" required>
                        </div>
                        <div class="col-md-6">
                            <label for="originLocation" class="form-label small fw-semibold">Origin / Craft Region *</label>
                            <input type="text" class="form-control" id="originLocation" th:field="*{originLocation}" placeholder="e.g. Coimbatore, Tamil Nadu" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label small fw-semibold">Product & Loom Description *</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="4" placeholder="Detail the weaving tradition, thread count, motifs, and care instructions..." required></textarea>
                    </div>

                    <!-- Multipart File Upload for Product Image -->
                    <div class="mb-4 p-3 bg-light rounded border">
                        <label class="form-label small fw-semibold">Product Photograph</label>
                        <input type="file" name="imageFile" id="imageFile" class="form-control form-control-sm mb-2" accept="image/*" data-preview-target="imgPreview">
                        <div class="small text-muted mb-2">Upload a clear photo of the handloom product (JPG, PNG, WebP up to 5MB).</div>
                        
                        <!-- Preview Image Container -->
                        <div class="d-flex align-items-center gap-3 mt-2">
                            <img id="imgPreview"
                                 th:src="${product.imageUrl != null ? product.imageUrl : '#'}"
                                 alt="Image Preview"
                                 class="rounded border"
                                 th:classappend="${product.imageUrl == null} ? 'd-none' : ''"
                                 style="width: 80px; height: 80px; object-fit: cover;">
                            <span class="small text-muted" th:if="${isEdit}">Current image will be kept if no new file is chosen.</span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <a th:href="@{/artisan/products}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-check-circle me-1"></i> <span th:text="${isEdit} ? 'Save Changes' : 'Publish Product'">Publish Product</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
