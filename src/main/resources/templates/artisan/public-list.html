<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Meet Our Artisans')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Artisans</li>
        </ol>
    </nav>

    <div class="mb-4">
        <h3 class="fw-bold mb-1"><i class="bi bi-people me-2 text-primary"></i> Master Artisans & Weavers</h3>
        <p class="text-muted small">Buy directly from the makers preserving India's timeless craft heritage</p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="artisan : ${artisans}">
            <div class="card border-0 shadow-sm p-4 rounded-3 h-100 d-flex flex-column">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <div class="artisan-avatar" th:text="${#strings.substring(artisan.businessName, 0, 1)}">L</div>
                    <div>
                        <h5 class="fw-bold mb-0 text-dark" th:text="${artisan.businessName}">Lakshmi Handlooms</h5>
                        <div class="text-muted small">
                            <i class="bi bi-geo-alt-fill text-danger me-1"></i> <span th:text="${artisan.location}">Coimbatore, Tamil Nadu</span>
                        </div>
                    </div>
                </div>

                <div class="mb-2">
                    <span class="badge bg-light text-dark border" th:text="${artisan.craftType}">Handwoven Sarees</span>
                </div>

                <p class="text-secondary small mb-3 flex-grow-1" th:text="${artisan.description}">
                    Artisan bio and craft background.
                </p>

                <div class="pt-3 border-top mt-auto">
                    <a th:href="@{/artisans/{id}(id=${artisan.id})}" class="btn btn-outline-primary btn-sm w-100 fw-semibold">
                        <i class="bi bi-shop me-1"></i> View Loom & Creations
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
