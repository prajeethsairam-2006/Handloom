<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Notice')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-5 rounded-3">
                <i class="bi bi-exclamation-triangle-fill text-warning fs-1 mb-3"></i>
                <h4 class="fw-bold text-dark mb-2">Notice</h4>
                <p class="text-secondary small mb-4" th:text="${errorMessage != null ? errorMessage : 'An error occurred while processing your request.'}">
                    An error occurred.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/}" class="btn btn-primary px-4">
                        <i class="bi bi-house me-1"></i> Return to Home
                    </a>
                    <a th:href="@{/products}" class="btn btn-outline-secondary px-4">
                        Browse Products
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
